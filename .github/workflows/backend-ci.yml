name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the pull request's commits, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      # Installs are always frozen. A lockfile that does not satisfy
      # package.json fails here rather than resolving something new.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # commitlint runs here rather than in its own job so it uses the
      # versions pinned in the lockfile. Installing it globally would be a
      # resolving install, and a global @commitlint/config-conventional is
      # not resolvable from the directory holding the config that extends it.
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --config commitlint.config.cjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
