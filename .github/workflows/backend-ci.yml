name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # Deliberately not filtered by base branch. A stacked pull request targets
  # the branch below it rather than develop, and that is exactly when the
  # checks matter most: it is the first time the combined change is seen.
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the pull request's commits, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      # Installs are always frozen. A lockfile that does not satisfy
      # package.json fails here rather than resolving something new.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # commitlint runs here rather than in its own job so it uses the
      # versions pinned in the lockfile. Installing it globally would be a
      # resolving install, and a global @commitlint/config-conventional is
      # not resolvable from the directory holding the config that extends it.
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --config commitlint.config.cjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres, not a mock. Row-level security, partial unique indexes
    # and check constraints are enforced by the database, so a suite built on a
    # mocked repository passes whether or not any of them exist.
    #
    # Testcontainers would also provide this. It was rejected on cost: 185
    # packages, 13 advisories including 3 high, and a native module that this
    # project's build-script policy blocks. A service container gives the same
    # guarantee for nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberschola
          POSTGRES_PASSWORD: cyberschola_ci_only
          POSTGRES_DB: cyberschola_test
        ports:
          - 5432:5432
        # Postgres accepts connections briefly before it is ready to serve. A
        # migration fired into that window fails in a way that looks random.
        options: >-
          --health-cmd "pg_isready -U cyberschola -d cyberschola_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://cyberschola:cyberschola_ci_only@localhost:5432/cyberschola_test
